<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RA — Sistema Solar</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <!-- IMPORTANTE: Debe subirse a un hosting con HTTPS (como GitHub Pages o Vercel) para que funcione -->
  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">
      <!-- Escala ajustada: 1 unidad = 1 metro. Aquí reducimos todo para que quepa en una mesa -->
      <a-entity position="0 0.5 0" scale="0.2 0.2 0.2">

        <!-- SOL -->
        <a-sphere radius="0.5" color="#FFC65D"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-sphere>

        <!-- MERCURIO -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
          <a-sphere position="0.8 0 0" radius="0.08" color="#a18435"></a-sphere>
        </a-entity>

        <!-- VENUS -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
          <a-sphere position="1.1 0 0" radius="0.12" color="#c7872e"></a-sphere>
        </a-entity>

        <!-- TIERRA -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
          <a-entity position="1.5 0 0">
            <a-sphere radius="0.13" color="#68c5ed"></a-sphere>
            <!-- LUNA -->
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear">
              <a-sphere position="0.2 0 0" radius="0.03" color="#EDEDED"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>

        <!-- MARTE -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear">
          <a-sphere position="2.0 0 0" radius="0.1" color="#ff7700"></a-sphere>
        </a-entity>

        <!-- JUPITER -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
          <a-sphere position="2.7 0 0" radius="0.25" color="#d99f6c"></a-sphere>
        </a-entity>

        <!-- SATURNO -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear">
          <a-entity position="3.5 0 0">
            <a-sphere radius="0.22" color="#e3cf8d"></a-sphere>
            <a-ring color="#a5945d" radius-inner="0.25" radius-outer="0.4" rotation="-80 0 0"></a-ring>
          </a-entity>
        </a-entity>

      </a-entity>

      <a-text value="Sistema Solar" align="center" position="0 0.8 1.2" rotation="-90 0 0" width="4"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
