<a-marker preset="hiro">

  <a-entity position="0 0.5 0" rotation="-15 0 0" scale="0.4 0.4 0.4">

    <!-- SOL -->
    <a-sphere radius="0.3" color="#FFC65D"
              animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
              animation__pulse="property: scale; dir: alternate; to: 1.1 1.1 1.1; loop: true; dur: 1500; easing: easeInOutSine">
    </a-sphere>

    <!-- Anillos-guía -->
    <a-ring color="#FFF" radius-inner="0.49" radius-outer="0.51" rotation="-90 0 0" opacity="0.3"></a-ring>
    <a-ring color="#FFF" radius-inner="0.69" radius-outer="0.71" rotation="-90 0 0" opacity="0.3"></a-ring>
    <a-ring color="#FFF" radius-inner="0.89" radius-outer="0.91" rotation="-90 0 0" opacity="0.3"></a-ring>
    <a-ring color="#FFF" radius-inner="1.19" radius-outer="1.21" rotation="-90 0 0" opacity="0.3"></a-ring>
    <a-ring color="#FFF" radius-inner="1.59" radius-outer="1.61" rotation="-90 0 0" opacity="0.3"></a-ring>
    <a-ring color="#FFF" radius-inner="2.09" radius-outer="2.11" rotation="-90 0 0" opacity="0.3"></a-ring>
    <a-ring color="#FFF" radius-inner="2.49" radius-outer="2.51" rotation="-90 0 0" opacity="0.3"></a-ring>
    <a-ring color="#FFF" radius-inner="2.89" radius-outer="2.91" rotation="-90 0 0" opacity="0.3"></a-ring>

    <!-- MERCURIO -->
    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      <a-sphere position="0.5 0 0" radius="0.05" color="#a18435"></a-sphere>
    </a-entity>

    <!-- VENUS -->
    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
      <a-sphere position="0.7 0 0" radius="0.08" color="#c7872e"></a-sphere>
    </a-entity>

    <!-- TIERRA -->
    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 11000; easing: linear">
      <a-entity position="0.9 0 0">
        <a-sphere radius="0.09" color="#68c5ed"></a-sphere>
        <!-- LUNA -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear">
          <a-sphere position="0.15 0 0" radius="0.02" color="#EDEDED"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- MARTE -->
    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear">
      <a-sphere position="1.2 0 0" radius="0.07" color="#ff7700"></a-sphere>
    </a-entity>

    <!-- JUPITER -->
    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 22000; easing: linear">
      <a-sphere position="1.6 0 0" radius="0.18" color="#d99f6c"></a-sphere>
    </a-entity>

    <!-- SATURNO -->
    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 28000; easing: linear">
      <a-entity position="2.1 0 0">
        <a-sphere radius="0.15" color="#e3cf8d"></a-sphere>
        <a-ring color="#a5945d" radius-inner="0.18" radius-outer="0.25" rotation="-80 0 0"></a-ring>
      </a-entity>
    </a-entity>

    <!-- URANO -->
    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 33000; easing: linear">
      <a-sphere position="2.5 0 0" radius="0.12" color="#2bbfc4"></a-sphere>
    </a-entity>

    <!-- NEPTUNO -->
    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 37000; easing: linear">
      <a-sphere position="2.9 0 0" radius="0.11" color="#124596"></a-sphere>
    </a-entity>

  </a-entity>

  <a-text value="Sistema Solar RA" align="center" position="0 1.2 0"
          rotation="-15 0 0" color="#FFF" width="4"></a-text>

</a-marker>

<a-entity camera></a-entity>
